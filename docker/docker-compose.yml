services:
  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - KnowVault-Core-net

  api:
    build:
      context: ./backend
      dockerfile: src/KnowVault-Core.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Host=postgres;Database=KnowVault-Core;Username=KnowVault-Core;Password=changeme}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - KnowVault-Core-net

  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-KnowVault-Core}
      - POSTGRES_USER=${POSTGRES_USER:-KnowVault-Core}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-KnowVault-Core} -d ${POSTGRES_DB:-KnowVault-Core}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - KnowVault-Core-net

volumes:
  pgdata:

networks:
  KnowVault-Core-net:
    driver: bridge

