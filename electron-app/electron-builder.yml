appId: com.KnowVault-Core.desktop
productName: KnowVault-Core Desktop
copyright: Copyright © 2026

directories:
  buildResources: assets
  output: dist

files:
  - src/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

